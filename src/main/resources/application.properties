spring.application.name=jebus-bank
#
#Faces Servlet
joinfaces.faces-servlet.async-supported=false
joinfaces.faces-servlet.enabled=true
joinfaces.faces-servlet.load-on-startup=1
joinfaces.faces-servlet.name=FacesServlet
joinfaces.faces-servlet.order=0
joinfaces.faces-servlet.url-mappings=/faces/*,*.jsf,*.faces,*.xhtml
#
#Faces Properties
joinfaces.faces.default-suffix=.xhtml
joinfaces.faces.state-saving-method=Server
joinfaces.faces.PROJECT_STAGE=Development
joinfaces.faces.partial-state-saving-method=true
joinfaces.faces.interpret-empty-string-submitted-values-as-null=true
joinfaces.faces.datetimeconverter-default-timezone-is-system-timezone=true
#
joinfaces.primefaces.theme=arya-blue
