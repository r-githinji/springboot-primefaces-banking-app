<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" 
	xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core" 
	xmlns:ui="jakarta.faces.facelets"
	xmlns:p="primefaces" 
	template="../../layout/template.xhtml">
	<ui:define name="page-title">
		<h:outputText value="Not Found" />
	</ui:define>
	<ui:define name="page-content">
		
		<div class="surface-ground flex flex-wrap align-items-center justify-content-center">
            <div class="flex flex-column align-items-center justify-content-center">              
                <div style="borderRadius: 56px; padding: 0.3rem; background: linear-gradient(180deg, rgba(233, 30, 99, 0.4) 10%, rgba(33, 150, 243, 0) 30%);"
                    class="border-1 surface-border">
                    <div class="w-full surface-card py-8 px-5 sm:px-8 flex flex-column align-items-center" style="borderRadius: 53px;">
                        <div class="flex justify-content-center align-items-center bg-pink-500 border-circle" style="height: 3.2rem; width: 3.2rem;'">
                            <i class="pi pi-fw pi-exclamation-circle text-2xl text-white"></i>
                        </div>
                        <h1 class="text-900 font-bold text-5xl mb-2">Error Occurred</h1>
                        <div class="text-600 mb-5">Something went wrong.</div>

                        <div class="mb-5 flex-shrink-0">
                            <i class="pi pi-cog pi-spin" style="fontSize: 4rem;" />
                        </div>
                        <p:button icon="pi pi-arrow-left" value="Go to Dashboard" />
                    </div>
                </div>
            </div>
        </div>
		
	</ui:define>
</ui:composition>
