<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" 
	xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core" 
	xmlns:ui="jakarta.faces.facelets"
	xmlns:p="primefaces" 
	template="../layout/template.xhtml">

	<ui:define name="page-content">

		<p:outputPanel styleClass="grid grid-nogutter gap-3 md:p-3 p-0 md:mt-0 mt-2 justify-content-center">
			<div class="col-12 md:col-6 lg:col-4">
				<div class="surface-card shadow-2 p-3 border-round">
					<div class="flex justify-content-between mb-3">
						<div class="flex-flex-column gap-3">
							<span class="block text-500 font-medium">Deposits</span>
							<div class="text-900 font-medium">
								<h:outputText value="#{dashboardBean.deposits}" styleClass="text-2xl">
									<f:convertNumber type="currency" currencySymbol="KES" pattern="#,##0.00;(#,##0.00)" />
								</h:outputText>
							</div>
						</div>
						<div class="flex align-items-center justify-content-center bg-cyan-100 border-round" style="width: 2.5rem; height: 2.5rem">
							<i class="pi pi-plus text-cyan-500 text-xl"></i>
						</div>
					</div>
				</div>
			</div>
			<div class="col-12 md:col-6 lg:col-4">
				<div class="surface-card shadow-2 p-3 border-round">
					<div class="flex justify-content-between mb-3">
						<div class="flex-flex-column gap-3">
							<span class="block text-500 font-medium">Withdrawals</span>
							<div class="text-900 font-medium">
								<h:outputText value="#{dashboardBean.withdrawals}" styleClass="text-2xl">
									<f:convertNumber type="currency" currencySymbol="KES" pattern="#,##0.00;(#,##0.00)" />
								</h:outputText>
							</div>
						</div>
						<div class="flex align-items-center justify-content-center bg-purple-100 border-round" style="width: 2.5rem; height: 2.5rem">
							<i class="pi pi-minus text-purple-500 text-xl"></i>
						</div>
					</div>
				</div>
			</div>
		</p:outputPanel>
		
	</ui:define>
</ui:composition>
